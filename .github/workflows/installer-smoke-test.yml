name: Installer smoke test

on:
  pull_request:
    paths:
      - 'install.sh'
      - 'xray_vless_failover*.sh'
      - 'xray_vless_go_watchdog_install.sh'
      - 'scripts/*.sh'
      - 'scripts/lib/**'
      - 'scripts/src/**'
      - 'packaging/entware/failover-go/**'
      - 'scripts/smoke-test.sh'
      - '.github/workflows/installer-smoke-test.yml'
  push:
    branches:
      - main
    paths:
      - 'install.sh'
      - 'xray_vless_failover*.sh'
      - 'xray_vless_go_watchdog_install.sh'
      - 'scripts/*.sh'
      - 'scripts/lib/**'
      - 'scripts/src/**'
      - 'packaging/entware/failover-go/**'
      - 'scripts/smoke-test.sh'
      - '.github/workflows/installer-smoke-test.yml'
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify generated scripts are up to date
        run: |
          sh scripts/build-generated-scripts.sh
          git diff --exit-code -- \
            install.sh \
            scripts/xray-go-direct-*.sh \
            scripts/xray-go-safety-check.sh \
            scripts/xray-go-space-gate.sh \
            scripts/vless-go-doctor.sh \
            scripts/vless-go-doctor-summary.sh \
            scripts/xray-go-agent-install.sh \
            scripts/xray-go-agent-unified-install.sh \
            scripts/xray-go-installer-update.sh \
            scripts/xray-go.sh || {
            echo "::error::Generated scripts are out of date. Edit scripts/src/ and/or scripts/lib/xray-go-common.sh, then run scripts/build-generated-scripts.sh and commit the result." >&2
            exit 1
          }

      - name: Run installer smoke test
        run: sh scripts/smoke-test.sh
