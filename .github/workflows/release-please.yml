name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re-)build and publish, skipping release-please. For manual recovery after a failed publish run.
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: [release-please]
    if: |
      always() &&
      (needs.release-please.outputs.release_created == 'true' || github.event.inputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || github.event.inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # On the normal release-please path the tag already exists. On a
      # manual workflow_dispatch recovery run it may not yet - create it
      # at the checked-out commit (the ref the run was dispatched from)
      # rather than requiring a separate "which commit" input.
      - name: Ensure release tag exists and check it out
        run: |
          if git rev-parse "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Tag $RELEASE_TAG already exists"
          else
            git tag "$RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi
          git checkout "$RELEASE_TAG"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Install AWG cross compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-mipsel-linux-gnu

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and upload stable router bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$RELEASE_TAG" \
          CHANNEL=latest \
          COMMIT="$(git rev-parse "$RELEASE_TAG^{commit}")" \
          PUBLISHED_AT="$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
          OUT_DIR=dist-router-bundles \
          WORK_DIR=/tmp/keenetic-router-bundle-work \
            sh scripts/build-router-bundles.sh
          gh release upload "$RELEASE_TAG" dist-router-bundles/* --repo "$GITHUB_REPOSITORY" --clobber

      # GoReleaser only materializes correctly-named binary-format
      # artifacts as part of the actual upload, not locally beforehand -
      # download them back to build the legacy per-file .sha256 sidecars
      # that scripts/xray-go-direct-install.sh and friends expect
      # (GO_SHA256_URL="${GO_BINARY_URL}.sha256"), alongside GoReleaser's
      # own combined checksums.txt.
      - name: Download published assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist-latest
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist-latest

      - name: Build latest agent channel manifest
        run: |
          CHANNEL=latest \
          VERSION="$RELEASE_TAG" \
          COMMIT="$(git rev-parse "$RELEASE_TAG^{commit}")" \
          PUBLISHED_AT="$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
          ASSET_DIR=dist-latest \
          OUT=dist-latest/agent-channel.json \
            sh scripts/build-agent-channel-manifest.sh

      - name: Generate per-file sha256 sidecars
        run: |
          cd dist-latest
          for f in *; do
            case "$f" in *.sha256|checksums.txt) continue ;; esac
            sha256sum "$f" | awk '{print $1}' > "${f}.sha256"
          done

      # 8+ install/update scripts on live routers (xray-go update,
      # agent/control-server install, minimal-go backend, entware feed)
      # hardcode releases/download/latest/<asset>[.sha256] URLs. Keep
      # that working by re-pointing the latest tag/release at whatever
      # release-please+GoReleaser just published, instead of requiring
      # every script to be updated to a specific version tag.
      - name: Move latest tag to this release
        run: |
          git tag -f latest "$RELEASE_TAG"
          git push origin latest --force

      - name: Create or update latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          NOTES="Mirrors $RELEASE_TAG. Always points at the newest release - see that release or CHANGELOG.md for what changed. Kept for install/update scripts that reference releases/download/latest/<asset>; point at $RELEASE_TAG directly for a pinned version."
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit latest --repo "$GITHUB_REPOSITORY" --title latest --notes "$NOTES"
          else
            gh release create latest --repo "$GITHUB_REPOSITORY" --title latest --notes "$NOTES" --target "$RELEASE_TAG"
          fi

      - name: Upload assets to latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          for asset in dist-latest/*; do
            case "$asset" in
              dist-latest/agent-channel.json|dist-latest/agent-channel.json.sha256) continue ;;
            esac
            gh release upload latest "$asset" --repo "$GITHUB_REPOSITORY" --clobber
          done
          # The mutable pointer is uploaded after all binaries, minimizing the
          # publication window where a router could need to retry a download.
          gh release upload latest dist-latest/agent-channel.json* --repo "$GITHUB_REPOSITORY" --clobber
