name: Update routes

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: write

jobs:
  update-routes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update managed route lists
        run: python3 scripts/update-routes.py

      - name: Validate route files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          routes = Path('routes')
          ok = True
          for path in sorted(routes.glob('*.txt')):
              expected = path.stem
              seen = set()
              for lineno, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if not line:
                      print(f'{path}:{lineno}: empty line', file=sys.stderr)
                      ok = False
                      continue
                  left, sep, right = line.partition('|')
                  if sep != '|' or left != expected or not right:
                      print(f'{path}:{lineno}: invalid route line: {line!r}', file=sys.stderr)
                      ok = False
                  if right in seen:
                      print(f'{path}:{lineno}: duplicate value: {right}', file=sys.stderr)
                      ok = False
                  seen.add(right)
          if not ok:
              raise SystemExit(1)
          PY

      - name: Commit and push changes
        run: |
          if git diff --quiet -- routes; then
            echo "No route changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routes
          git commit -m "Update managed route lists"
          git push origin HEAD:main
