name: Build Go helper

on:
  pull_request:
    paths:
      - 'cmd/xray-failover-go/**'
      - 'scripts/build-go-installers.sh'
      - '.github/workflows/build-go.yml'
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'cmd/xray-failover-go/**'
      - 'scripts/build-go-installers.sh'
      - '.github/workflows/build-go.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Run tests
        env:
          GO111MODULE: off
        run: go test ./cmd/xray-failover-go

      - name: Build linux/arm64 binary
        run: sh scripts/build-go-installers.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xray-failover-go-linux-arm64
          path: dist/xray-failover-go-linux-arm64
          if-no-files-found: error

      - name: Attach binary to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/xray-failover-go-linux-arm64

  patch-busybox-elf-branch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: busybox-compatible-elf-check
          fetch-depth: 0
      - name: Apply BusyBox-compatible ELF patch to target branch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          elf_magic = '''
elf_magic() {
    file="$1"

    if command -v hexdump >/dev/null 2>&1; then
        hexdump -n 4 -e '4/1 "%02x"' "$file" 2>/dev/null
        return 0
    fi

    if command -v od >/dev/null 2>&1; then
        dd if="$file" bs=4 count=1 2>/dev/null | od -t x1 | sed 's/^[0-9* ]*//' | tr -d ' \\n'
        return 0
    fi

    echo ""
}
'''

          def insert_function(path, anchor):
              p = Path(path)
              s = p.read_text()
              if 'elf_magic() {' not in s:
                  if anchor not in s:
                      raise SystemExit(f'anchor not found: {path}')
                  s = s.replace(anchor, anchor + elf_magic, 1)
                  p.write_text(s)

          def replace_magic_line(path, variable_name, error_line):
              p = Path(path)
              lines = p.read_text().splitlines(True)
              out = []
              replaced = False
              diag_present = any('ELF magic: ${magic:-unavailable}' in line for line in lines)
              for line in lines:
                  if 'od -A n' in line and variable_name in line:
                      out.append(f'    magic="$(elf_magic "${variable_name}")"\n')
                      replaced = True
                      continue
                  out.append(line)
                  if error_line in line and not diag_present:
                      out.append('        echo "ELF magic: ${magic:-unavailable}" >&2\n')
                      diag_present = True
              if not replaced and 'od -A n' in ''.join(lines):
                  raise SystemExit(f'failed to replace od -A n in {path}')
              p.write_text(''.join(out))

          insert_function(
              'xray_vless_failover_go.sh',
              'copy_mode() { src="$1"; dst="$2"; mode="${3:-755}"; mkdir -p "$(dirname "$dst")"; cp "$src" "$dst"; chmod "$mode" "$dst"; }\n',
          )
          replace_magic_line(
              'xray_vless_failover_go.sh',
              'tmp_bin',
              'echo "ОШИБКА: скачанный Go resolver не является ELF-бинарником." >&2',
          )

          insert_function(
              'xray_vless_failover_minimal_go.sh',
              'get_xray_bin() { if command -v xray >/dev/null 2>&1; then command -v xray; elif [ -x /opt/sbin/xray ]; then echo /opt/sbin/xray; elif [ -x /opt/bin/xray ]; then echo /opt/bin/xray; else echo ""; fi; }\n',
          )
          replace_magic_line(
              'xray_vless_failover_minimal_go.sh',
              'tmp',
              'echo "ERROR: downloaded Go resolver is not an ELF binary: $URL" >&2',
          )
          PY

          sh -n xray_vless_failover_go.sh
          sh -n xray_vless_failover_minimal_go.sh
          ! grep -R "od -A n" xray_vless_failover_go.sh xray_vless_failover_minimal_go.sh
          grep -q 'elf_magic()' xray_vless_failover_go.sh
          grep -q 'elf_magic()' xray_vless_failover_minimal_go.sh
          grep -q 'ELF magic: ${magic:-unavailable}' xray_vless_failover_go.sh
          grep -q 'ELF magic: ${magic:-unavailable}' xray_vless_failover_minimal_go.sh

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add xray_vless_failover_go.sh xray_vless_failover_minimal_go.sh
          git commit -m "Use BusyBox-compatible ELF magic check"
          git push origin busybox-compatible-elf-check

      - name: Restore build workflow on main
        shell: bash
        run: |
          git fetch origin main
          git checkout main
          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/build-go.yml')
          s = p.read_text()
          marker = '\n  patch-busybox-elf-branch:\n'
          if marker in s:
              s = s.split(marker, 1)[0].rstrip() + '\n'
              p.write_text(s)
          PY
          git add .github/workflows/build-go.yml
          git commit -m "Restore Go build workflow"
          git push origin main
