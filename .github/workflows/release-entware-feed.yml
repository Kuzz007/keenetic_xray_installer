name: Release Entware Feed

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload feed assets to
        required: true
      version:
        description: Package version
        required: false
        default: 0.1.11-go-experimental
      arch:
        description: Entware architecture. Leave empty to infer from tag suffix.
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release-feed:
    runs-on: ubuntu-latest
    env:
      INPUT_VERSION: ${{ github.event.inputs.version || '0.1.11-go-experimental' }}
      INPUT_ARCH: ${{ github.event.inputs.arch || '' }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve feed parameters
        run: |
          set -e
          PKG_VERSION="$INPUT_VERSION"
          PKG_ARCH="$INPUT_ARCH"

          if [ -z "$PKG_ARCH" ]; then
            case "$RELEASE_TAG" in
              *-mipselsf-k3.4) PKG_ARCH="mipselsf-k3.4" ;;
              *-mipsel-3.4) PKG_ARCH="mipsel-3.4" ;;
              *) PKG_ARCH="aarch64-3.10" ;;
            esac
          fi

          echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"
          echo "PKG_ARCH=$PKG_ARCH" >> "$GITHUB_ENV"
          echo "Resolved release tag: $RELEASE_TAG"
          echo "Resolved package version: $PKG_VERSION"
          echo "Resolved package architecture: $PKG_ARCH"

      - name: Create or update target release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          NOTES_FILE="dist-entware-feed-notes.md"
          cat > "$NOTES_FILE" <<EOF
          ## $RELEASE_TAG

          Entware feed assets for failover-go.

          ```text
          version: $PKG_VERSION
          architecture: $PKG_ARCH
          ```

          Current latest-channel mapping:

          ```text
          aarch64-3.10  -> latest
          mipsel-3.4   -> latest-mipsel-3.4
          mipselsf-k3.4 -> latest-mipselsf-k3.4
          ```

          This release is architecture-specific because Entware feed roots contain architecture-specific Packages and Packages.gz files.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --notes-file "$NOTES_FILE" \
              --prerelease
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes-file "$NOTES_FILE" \
              --prerelease
          fi

      - name: Build Entware feed
        run: |
          chmod +x scripts/build-entware-feed.sh
          PKG_VERSION="$PKG_VERSION" PKG_ARCH="$PKG_ARCH" scripts/build-entware-feed.sh
          cd dist/entware-feed
          tar -czf ../entware-feed_${PKG_VERSION}_${PKG_ARCH}.tar.gz .
          cd ../..
          sha256sum dist/entware-feed_${PKG_VERSION}_${PKG_ARCH}.tar.gz > dist/entware-feed_${PKG_VERSION}_${PKG_ARCH}.tar.gz.sha256

      - name: Upload feed assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/entware-feed/Packages \
            dist/entware-feed/Packages.gz \
            dist/entware-feed/failover-go_${PKG_VERSION}_${PKG_ARCH}.ipk \
            dist/entware-feed/failover-go_${PKG_VERSION}_${PKG_ARCH}.ipk.sha256 \
            dist/entware-feed_${PKG_VERSION}_${PKG_ARCH}.tar.gz \
            dist/entware-feed_${PKG_VERSION}_${PKG_ARCH}.tar.gz.sha256 \
            --clobber
