name: Apply BusyBox ELF patch to branch

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-busybox-elf-patch-main.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: busybox-compatible-elf-check
          fetch-depth: 0
      - name: Patch target branch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          ELF_MAGIC = '''
elf_magic() {
    file="$1"

    if command -v hexdump >/dev/null 2>&1; then
        hexdump -n 4 -e '4/1 "%02x"' "$file" 2>/dev/null
        return 0
    fi

    if command -v od >/dev/null 2>&1; then
        dd if="$file" bs=4 count=1 2>/dev/null | od -t x1 | sed 's/^[0-9* ]*//' | tr -d ' \\n'
        return 0
    fi

    echo ""
}
'''

          def insert_function(path, anchor):
              p = Path(path)
              s = p.read_text()
              if 'elf_magic() {' not in s:
                  if anchor not in s:
                      raise SystemExit(f'anchor not found: {path}')
                  s = s.replace(anchor, anchor + ELF_MAGIC, 1)
                  p.write_text(s)

          def replace_magic_line(path, tmp_name, error_line):
              p = Path(path)
              lines = p.read_text().splitlines(True)
              out = []
              inserted_diag = False
              replaced = False
              for line in lines:
                  if 'od -A n' in line and tmp_name in line:
                      out.append(f'    magic="$(elf_magic "${tmp_name}")"\n')
                      replaced = True
                      continue
                  out.append(line)
                  if error_line in line and not inserted_diag:
                      diag = '        echo "ELF magic: ${magic:-unavailable}" >&2\n'
                      if diag not in ''.join(lines):
                          out.append(diag)
                      inserted_diag = True
              if not replaced and 'od -A n' in ''.join(lines):
                  raise SystemExit(f'failed to replace od -A n in {path}')
              p.write_text(''.join(out))

          insert_function(
              'xray_vless_failover_go.sh',
              'copy_mode() { src="$1"; dst="$2"; mode="${3:-755}"; mkdir -p "$(dirname "$dst")"; cp "$src" "$dst"; chmod "$mode" "$dst"; }\n',
          )
          replace_magic_line(
              'xray_vless_failover_go.sh',
              'tmp_bin',
              'echo "ОШИБКА: скачанный Go resolver не является ELF-бинарником." >&2',
          )

          insert_function(
              'xray_vless_failover_minimal_go.sh',
              'get_xray_bin() { if command -v xray >/dev/null 2>&1; then command -v xray; elif [ -x /opt/sbin/xray ]; then echo /opt/sbin/xray; elif [ -x /opt/bin/xray ]; then echo /opt/bin/xray; else echo ""; fi; }\n',
          )
          replace_magic_line(
              'xray_vless_failover_minimal_go.sh',
              'tmp',
              'echo "ERROR: downloaded Go resolver is not an ELF binary: $URL" >&2',
          )

          for wf in [
              '.github/workflows/apply-busybox-elf-patch.yml',
              '.github/workflows/apply-busybox-elf-patch-main.yml',
          ]:
              path = Path(wf)
              if path.exists():
                  path.unlink()
          PY

          sh -n xray_vless_failover_go.sh
          sh -n xray_vless_failover_minimal_go.sh
          ! grep -R "od -A n" xray_vless_failover_go.sh xray_vless_failover_minimal_go.sh
          grep -q 'elf_magic()' xray_vless_failover_go.sh
          grep -q 'elf_magic()' xray_vless_failover_minimal_go.sh

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use BusyBox-compatible ELF magic check"
          git push origin busybox-compatible-elf-check

      - name: Remove temporary workflow from main
        shell: bash
        run: |
          git fetch origin main
          git checkout main
          rm -f .github/workflows/apply-busybox-elf-patch-main.yml
          git add -A
          git commit -m "Remove temporary BusyBox ELF patch workflow"
          git push origin main
