name: Shellcheck

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run shellcheck
        run: |
          files="$(git ls-files '*.sh' 'packaging/entware/failover-go/postinst' 'packaging/entware/failover-go/prerm' 'packaging/router/files/S23keenetic-awg-recover')"
          echo "$files" | xargs shellcheck -s sh -S warning
