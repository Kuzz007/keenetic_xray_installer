name: Publish unified agent test release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create/update
        required: false
        default: unified-agent-test
  push:
    branches:
      - unified-agent-test
    paths:
      - cmd/xray-go-agent/**
      - scripts/xray-go-agent-unified-install.sh
      - .github/workflows/publish-unified-agent-test.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || 'unified-agent-test' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: unified-agent-test

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Build unified agent assets
        run: |
          set -e
          mkdir -p dist
          sed -i 's/const agentVersion = "0.1.4-go-experimental"/const agentVersion = "0.2.0-unified-test"/' cmd/xray-go-agent/main.go
          sed -i 's/const agentVersion = "0.1.5-go-experimental"/const agentVersion = "0.2.0-unified-test"/' cmd/xray-go-agent/main.go

          CGO_ENABLED=0 GO111MODULE=off GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags "-s -w" \
            -o "dist/xray-go-unified-agent-linux-arm64" ./cmd/xray-go-agent
          chmod +x "dist/xray-go-unified-agent-linux-arm64"
          sha256sum "dist/xray-go-unified-agent-linux-arm64" | tee "dist/xray-go-unified-agent-linux-arm64.sha256"

          CGO_ENABLED=0 GO111MODULE=off GOOS=linux GOARCH=mipsle GOMIPS=softfloat \
            go build -trimpath -ldflags "-s -w" \
            -o "dist/xray-go-unified-agent-linux-mipsle" ./cmd/xray-go-agent
          chmod +x "dist/xray-go-unified-agent-linux-mipsle"
          sha256sum "dist/xray-go-unified-agent-linux-mipsle" | tee "dist/xray-go-unified-agent-linux-mipsle.sha256"

          CGO_ENABLED=0 GO111MODULE=off GOOS=linux GOARCH=mips GOMIPS=softfloat \
            go build -trimpath -ldflags "-s -w" \
            -o "dist/xray-go-unified-agent-linux-mips" ./cmd/xray-go-agent
          chmod +x "dist/xray-go-unified-agent-linux-mips"
          sha256sum "dist/xray-go-unified-agent-linux-mips" | tee "dist/xray-go-unified-agent-linux-mips.sha256"

      - name: Create or update prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          NOTES_FILE="dist/release-notes.md"
          cat > "$NOTES_FILE" <<'EOF'
          ## unified-agent-test

          Experimental unified router agent test channel.

          This release publishes one Go agent implementation for multiple Keenetic/Entware router CPU families:

          ```text
          xray-go-unified-agent-linux-arm64
          xray-go-unified-agent-linux-mipsle
          xray-go-unified-agent-linux-mips
          ```

          Version line: `0.2.0-unified-test`.

          Scope:

          - replaces shell-agent and Go-agent split on test routers
          - keeps existing router config at `/opt/etc/xray/xray-go-agent.conf`
          - uses one outbound polling protocol and one capability set
          - supports status, switching, source updates, subscription refresh, recovery, logs, scripts update, agent update, routes catalog and reboot actions

          Notes:

          - This is a test channel and does not update the production `latest` release.
          - Use only on selected test routers.
          - Rollback: run the normal shell or Go agent installer from `main`/`latest`.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --notes-file "$NOTES_FILE" \
              --prerelease
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes-file "$NOTES_FILE" \
              --prerelease
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ASSETS="
          dist/xray-go-unified-agent-linux-arm64
          dist/xray-go-unified-agent-linux-arm64.sha256
          dist/xray-go-unified-agent-linux-mipsle
          dist/xray-go-unified-agent-linux-mipsle.sha256
          dist/xray-go-unified-agent-linux-mips
          dist/xray-go-unified-agent-linux-mips.sha256
          "

          for asset in $ASSETS; do
            echo "Uploading $asset"
            attempt=1
            until gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --clobber; do
              if [ "$attempt" -ge 5 ]; then
                echo "ERROR: failed to upload $asset after $attempt attempts" >&2
                exit 1
              fi
              sleep_for=$((attempt * 10))
              echo "WARN: upload failed for $asset; retrying in ${sleep_for}s" >&2
              sleep "$sleep_for"
              attempt=$((attempt + 1))
            done
          done

      - name: Show release download URLs
        run: |
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/xray-go-unified-agent-linux-arm64"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/xray-go-unified-agent-linux-mipsle"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/xray-go-unified-agent-linux-mips"
