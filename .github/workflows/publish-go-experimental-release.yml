name: Publish Go experimental release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create/update
        required: false
        default: latest
  push:
    branches:
      - main
    paths:
      - cmd/xray-failover-go/**
      - cmd/vless-go-web/**
      - cmd/xray-go-web/**
      - cmd/xray-go-agent/**
      - cmd/xray-go-control-server/**
      - .github/workflows/publish-go-experimental-release.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || 'latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Build linux helper assets
        run: |
          mkdir -p dist
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CONTROL_SERVER_LDFLAGS="-s -w -X main.buildCommit=${GITHUB_SHA} -X main.buildTime=${BUILD_TIME}"
          sed -i 's/const agentVersion = "0.1.4-go-experimental"/const agentVersion = "0.2.0-unified"/' cmd/xray-go-agent/main.go
          sed -i 's/const agentVersion = "0.1.5-go-experimental"/const agentVersion = "0.2.0-unified"/' cmd/xray-go-agent/main.go
          sed -i 's/const agentVersion = "0.2.0-unified-test"/const agentVersion = "0.2.0-unified"/' cmd/xray-go-agent/main.go

          CGO_ENABLED=0 GO111MODULE=off GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags "-s -w" \
            -o "dist/xray-failover-go-linux-arm64" ./cmd/xray-failover-go
          chmod +x "dist/xray-failover-go-linux-arm64"
          sha256sum "dist/xray-failover-go-linux-arm64" | tee "dist/xray-failover-go-linux-arm64.sha256"

          CGO_ENABLED=0 GO111MODULE=off GOOS=linux GOARCH=mipsle GOMIPS=softfloat \
            go build -trimpath -ldflags "-s -w" \
            -o "dist/xray-failover-go-linux-mipsle" ./cmd/xray-failover-go
          chmod +x "dist/xray-failover-go-linux-mipsle"
          sha256sum "dist/xray-failover-go-linux-mipsle" | tee "dist/xray-failover-go-linux-mipsle.sha256"

          CGO_ENABLED=0 GO111MODULE=off GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags "-s -w" \
            -o "dist/vless-go-web-linux-arm64" ./cmd/xray-go-web
          chmod +x "dist/vless-go-web-linux-arm64"
          sha256sum "dist/vless-go-web-linux-arm64" | tee "dist/vless-go-web-linux-arm64.sha256"

          CGO_ENABLED=0 GO111MODULE=off GOOS=linux GOARCH=mipsle GOMIPS=softfloat \
            go build -trimpath -ldflags "-s -w" \
            -o "dist/vless-go-web-linux-mipsle" ./cmd/xray-go-web
          chmod +x "dist/vless-go-web-linux-mipsle"
          sha256sum "dist/vless-go-web-linux-mipsle" | tee "dist/vless-go-web-linux-mipsle.sha256"

          CGO_ENABLED=0 GO111MODULE=off GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags "-s -w" \
            -o "dist/xray-go-agent-linux-arm64" ./cmd/xray-go-agent
          chmod +x "dist/xray-go-agent-linux-arm64"
          sha256sum "dist/xray-go-agent-linux-arm64" | tee "dist/xray-go-agent-linux-arm64.sha256"

          CGO_ENABLED=0 GO111MODULE=off GOOS=linux GOARCH=mipsle GOMIPS=softfloat \
            go build -trimpath -ldflags "-s -w" \
            -o "dist/xray-go-agent-linux-mipsle" ./cmd/xray-go-agent
          chmod +x "dist/xray-go-agent-linux-mipsle"
          sha256sum "dist/xray-go-agent-linux-mipsle" | tee "dist/xray-go-agent-linux-mipsle.sha256"

          CGO_ENABLED=0 GO111MODULE=off GOOS=linux GOARCH=mips GOMIPS=softfloat \
            go build -trimpath -ldflags "-s -w" \
            -o "dist/xray-go-agent-linux-mips" ./cmd/xray-go-agent
          chmod +x "dist/xray-go-agent-linux-mips"
          sha256sum "dist/xray-go-agent-linux-mips" | tee "dist/xray-go-agent-linux-mips.sha256"

          CGO_ENABLED=0 GO111MODULE=off GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "$CONTROL_SERVER_LDFLAGS" \
            -o "dist/xray-go-control-server-linux-amd64" ./cmd/xray-go-control-server
          chmod +x "dist/xray-go-control-server-linux-amd64"
          sha256sum "dist/xray-go-control-server-linux-amd64" | tee "dist/xray-go-control-server-linux-amd64.sha256"

          CGO_ENABLED=0 GO111MODULE=off GOOS=linux GOARCH=arm64 \
            go build -trimpath -ldflags "$CONTROL_SERVER_LDFLAGS" \
            -o "dist/xray-go-control-server-linux-arm64" ./cmd/xray-go-control-server
          chmod +x "dist/xray-go-control-server-linux-arm64"
          sha256sum "dist/xray-go-control-server-linux-arm64" | tee "dist/xray-go-control-server-linux-arm64.sha256"

      - name: Create or update prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          NOTES_FILE="dist/release-notes.md"
          cat > "$NOTES_FILE" <<'EOF'
          ## latest

          Latest experimental Go edition build for Keenetic/Entware VLESS failover.

          This release publishes Go resolver/generator, optional Web UI, and unified control-bot agent assets:

          ```text
          xray-failover-go-linux-arm64
          xray-failover-go-linux-mipsle
          vless-go-web-linux-arm64
          vless-go-web-linux-mipsle
          xray-go-agent-linux-arm64
          xray-go-agent-linux-mipsle
          xray-go-agent-linux-mips
          xray-go-control-server-linux-amd64
          xray-go-control-server-linux-arm64
          ```

          Current package line: `v0.2.0-unified`.

          Includes:

          - unified Go router agent path for arm64/aarch64, mipsel/mipselsf/mipsle and mips
          - unified `xray-go` command wrapper
          - support-safe `xray-go doctor --support`
          - quiet hourly recovery helpers for Full Go and Minimal Go
          - recovery status in `xray-go status` and doctor support output
          - rebuilt Russian Web UI source aligned with `xray-go` and recovery workflow
          - Full Go Entware architecture detection for arm64 and mipsel/mipselsf
          - hardened Full Go installer downloads and ELF validation
          - shell smoke-test guardrails for installers and helper scripts
          - experimental VPS control server and outbound router agent MVP
          - control-bot subscription refresh action for router agents
          - agent support for saved subscription refresh and http(s) subscription source URLs
          - control-server compatibility helpers restored for source wizard builds
          - recovery dependency checks and Proxy0 recreation helpers

          Notes:

          - The Web UI should be used only in a trusted LAN.
          - The control-bot assets are experimental and should be tested before production use.
          - Router agents use outbound polling; no inbound router port is required.
          - Raw VLESS links, UUIDs, server addresses, and subscription URLs are not intentionally printed by support diagnostics.
          EOF

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --notes-file "$NOTES_FILE" \
              --prerelease
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes-file "$NOTES_FILE" \
              --prerelease
          fi

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          ASSETS="
          dist/xray-failover-go-linux-arm64
          dist/xray-failover-go-linux-arm64.sha256
          dist/xray-failover-go-linux-mipsle
          dist/xray-failover-go-linux-mipsle.sha256
          dist/vless-go-web-linux-arm64
          dist/vless-go-web-linux-arm64.sha256
          dist/vless-go-web-linux-mipsle
          dist/vless-go-web-linux-mipsle.sha256
          dist/xray-go-agent-linux-arm64
          dist/xray-go-agent-linux-arm64.sha256
          dist/xray-go-agent-linux-mipsle
          dist/xray-go-agent-linux-mipsle.sha256
          dist/xray-go-agent-linux-mips
          dist/xray-go-agent-linux-mips.sha256
          dist/xray-go-control-server-linux-amd64
          dist/xray-go-control-server-linux-amd64.sha256
          dist/xray-go-control-server-linux-arm64
          dist/xray-go-control-server-linux-arm64.sha256
          "

          for asset in $ASSETS; do
            echo "Uploading $asset"
            attempt=1
            until gh release upload "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --clobber; do
              if [ "$attempt" -ge 5 ]; then
                echo "ERROR: failed to upload $asset after $attempt attempts" >&2
                exit 1
              fi
              sleep_for=$((attempt * 10))
              echo "WARN: upload failed for $asset; retrying in ${sleep_for}s" >&2
              sleep "$sleep_for"
              attempt=$((attempt + 1))
            done
          done

      - name: Show release download URLs
        run: |
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/xray-failover-go-linux-arm64"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/xray-failover-go-linux-mipsle"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/vless-go-web-linux-arm64"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/vless-go-web-linux-mipsle"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/xray-go-agent-linux-arm64"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/xray-go-agent-linux-mipsle"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/xray-go-agent-linux-mips"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/xray-go-control-server-linux-amd64"
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/xray-go-control-server-linux-arm64"
