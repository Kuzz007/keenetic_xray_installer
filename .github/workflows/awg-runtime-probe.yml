name: AWG runtime probe

on:
  pull_request:
    paths:
      - 'scripts/build-awg-runtime-probe.sh'
      - 'scripts/build-router-bundles.sh'
      - 'scripts/smoke-awg-runtime-linux.sh'
      - 'scripts/keenetic-awg-live-probe.sh'
      - '.github/workflows/awg-runtime-probe.yml'
      - 'docs/amneziawg-runtime.md'
      - 'docs/amneziawg-live-router-probe.md'
      - 'docs/amneziawg-single-slot.md'
  push:
    branches:
      - main
    paths:
      - 'scripts/build-awg-runtime-probe.sh'
      - 'scripts/build-router-bundles.sh'
      - 'scripts/smoke-awg-runtime-linux.sh'
      - 'scripts/keenetic-awg-live-probe.sh'
      - '.github/workflows/awg-runtime-probe.yml'
      - 'docs/amneziawg-runtime.md'
      - 'docs/amneziawg-live-router-probe.md'
      - 'docs/amneziawg-single-slot.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: arm64
            compiler_package: gcc-aarch64-linux-gnu
            qemu: qemu-aarch64-static
          - arch: mipsle
            compiler_package: gcc-mipsel-linux-gnu
            qemu: qemu-mipsel-static
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Install cross compiler and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static ${{ matrix.compiler_package }}

      - name: Build pinned AWG runtime
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          OUT_DIR: dist/awg-runtime-probe
          PROJECT_COMMIT: ${{ github.sha }}
        run: sh scripts/build-awg-runtime-probe.sh

      - name: Verify cross-built executables
        run: |
          runtime="dist/awg-runtime-probe/amneziawg-go-linux-${{ matrix.arch }}"
          tools="dist/awg-runtime-probe/amneziawg-tools-linux-${{ matrix.arch }}"

          runtime_version="$(${{ matrix.qemu }} "$runtime" --version)"
          tools_version="$(${{ matrix.qemu }} "$tools" --version)"
          printf '%s\n' "$runtime_version"
          printf '%s\n' "$tools_version"
          printf '%s\n' "$runtime_version" | grep -F 'amneziawg-go 0.0.20250522'
          printf '%s\n' "$tools_version" | grep -F 'v3.0.20260805'

          if readelf -l "$tools" | grep -q 'Requesting program interpreter'; then
            echo "::error::amneziawg-tools must be statically linked"
            exit 1
          fi

          runtime_sha="$(sha256sum "$runtime" | awk '{print $1}')"
          tools_sha="$(sha256sum "$tools" | awk '{print $1}')"
          [ "$runtime_sha" = "$(cat "$runtime.sha256")" ]
          [ "$tools_sha" = "$(cat "$tools.sha256")" ]

      - name: Upload probe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: awg-runtime-probe-linux-${{ matrix.arch }}
          path: dist/awg-runtime-probe/*
          if-no-files-found: error

  native-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Install runtime probe dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y iproute2

      - name: Build native probe runtime
        env:
          TARGET_ARCH: amd64
          OUT_DIR: dist/awg-runtime-probe
          PROJECT_COMMIT: ${{ github.sha }}
        run: sh scripts/build-awg-runtime-probe.sh

      - name: Configure AWG2 interface and measure idle memory
        run: |
          sudo sh scripts/smoke-awg-runtime-linux.sh \
            "$(pwd)/dist/awg-runtime-probe/amneziawg-go-linux-amd64" \
            "$(pwd)/dist/awg-runtime-probe/amneziawg-tools-linux-amd64" \
            | tee dist/awg-runtime-probe/runtime-measurements.txt

          {
            echo '### AWG native runtime probe'
            echo
            sed 's/^/- /' dist/awg-runtime-probe/runtime-measurements.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Exercise fail-closed live router probe
        run: |
          probe="$(pwd)/dist/awg-runtime-probe/keenetic-awg-live-probe.sh"
          runtime="$(pwd)/dist/awg-runtime-probe/amneziawg-go-linux-amd64"
          tools="$(pwd)/dist/awg-runtime-probe/amneziawg-tools-linux-amd64"

          sudo sh "$probe" preflight \
            | tee dist/awg-runtime-probe/live-router-preflight.txt

          if no_confirm_output="$(sudo sh "$probe" run \
            --runtime "$runtime" \
            --tools "$tools" \
            --seconds 1 2>&1)"; then
            echo '::error::live probe started without explicit --yes'
            exit 1
          fi
          printf '%s\n' "$no_confirm_output" \
            >dist/awg-runtime-probe/live-router-no-confirm.txt
          grep -F 'run requires explicit --yes' \
            dist/awg-runtime-probe/live-router-no-confirm.txt
          if ip link show awgprobe0 >/dev/null 2>&1; then
            echo '::error::no-confirm path left awgprobe0 behind'
            exit 1
          fi

          sudo sh "$probe" run --yes \
            --runtime "$runtime" \
            --tools "$tools" \
            --seconds 1 \
            | tee dist/awg-runtime-probe/live-router-measurements.txt

          grep -F 'AWG_PROBE_ROUTE_RESTORED=yes' \
            dist/awg-runtime-probe/live-router-measurements.txt
          grep -F 'AWG_PROBE_RULES_RESTORED=yes' \
            dist/awg-runtime-probe/live-router-measurements.txt
          grep -F 'AWG_PROBE_MANAGED_STATE_RESTORED=yes' \
            dist/awg-runtime-probe/live-router-measurements.txt
          grep -F 'AWG_PROBE_RESULT=pass' \
            dist/awg-runtime-probe/live-router-measurements.txt

          {
            echo '### Fail-closed live router probe'
            echo
            sed 's/^/- /' dist/awg-runtime-probe/live-router-measurements.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload native measurements
        uses: actions/upload-artifact@v4
        with:
          name: awg-runtime-probe-linux-amd64
          path: dist/awg-runtime-probe/*
          if-no-files-found: error
