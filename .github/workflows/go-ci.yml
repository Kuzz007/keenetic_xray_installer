name: Go CI

on:
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'packaging/router/**'
      - 'go.mod'
      - 'scripts/build-go-installers.sh'
      - 'scripts/build-router-bundles.sh'
      - '.github/workflows/go-ci.yml'
  push:
    branches:
      - main
      - feature-router-groups
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'packaging/router/**'
      - 'go.mod'
      - 'scripts/build-go-installers.sh'
      - 'scripts/build-router-bundles.sh'
      - '.github/workflows/go-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Check formatting
        run: |
          # mux_config.go and control-server/main.go are deliberately written
          # in a compact single-line style and are excluded here rather than
          # reformatted.
          files="$(gofmt -l . | grep -v '^cmd/xray-go-agent/mux_config.go$' | grep -v '^cmd/xray-go-control-server/main.go$' || true)"
          if [ -n "$files" ]; then
            echo "Files need gofmt:"
            echo "$files"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - binary: xray-failover-go
            goarch: arm64
          - binary: xray-failover-go
            goarch: mipsle
          - binary: xray-go-agent
            goarch: arm64
          - binary: xray-go-agent
            goarch: mipsle
          - binary: xray-go-agent
            goarch: mips
          - binary: xray-go-control-server
            goarch: amd64
          - binary: xray-go-control-server
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Build ${{ matrix.binary }} (linux/${{ matrix.goarch }})
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOMIPS: softfloat
        run: |
          mkdir -p dist
          out="dist/${{ matrix.binary }}-linux-${{ matrix.goarch }}"
          go build -trimpath -ldflags "-s -w" -o "$out" "./cmd/${{ matrix.binary }}"
          chmod +x "$out"

      # arm64/mipsle/mips binaries can't run natively on this amd64 runner.
      # qemu-user-static lets us exec them directly (no binfmt_misc
      # registration needed since we invoke the interpreter explicitly) to
      # catch cross-compilation/runtime problems before a release ships
      # them. docker/setup-qemu-action's bundled emulators were considered
      # but dropped mips/mipsle support upstream; apt's package still
      # covers them.
      - name: Install QEMU user-mode emulation
        if: matrix.goarch != 'amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Smoke test ${{ matrix.binary }} (linux/${{ matrix.goarch }})
        run: |
          bin="dist/${{ matrix.binary }}-linux-${{ matrix.goarch }}"

          runner=""
          case "${{ matrix.goarch }}" in
          arm64) runner="qemu-aarch64-static" ;;
          mipsle) runner="qemu-mipsel-static" ;;
          mips) runner="qemu-mips-static" ;;
          esac

          case "${{ matrix.binary }}" in
          xray-failover-go | xray-go-agent)
            if out="$($runner "$bin" -version 2>&1)"; then status=0; else status=$?; fi
            echo "$out"
            [ "$status" -eq 0 ] || { echo "::error::exit status $status, want 0"; exit 1; }
            [ -n "$out" ] || { echo "::error::expected -version to print something"; exit 1; }
            ;;
          xray-go-control-server)
            # The control server has no no-op flag: it is a daemon that loads
            # a config and then runs forever. Pointing at a config path that
            # can't exist on the runner makes it fail fast and
            # deterministically at the same early loadConfig() call instead,
            # which is enough to prove the binary is valid machine code for
            # this architecture and that the Go runtime initializes - a
            # SIGILL/exec-format crash would exit with a signal-based status
            # (e.g. 132), not this clean status 1.
            if out="$($runner "$bin" -config /nonexistent/xray-go-smoke-test.conf 2>&1)"; then status=0; else status=$?; fi
            echo "$out"
            [ "$status" -eq 1 ] || { echo "::error::exit status $status, want 1 (missing-config failure)"; exit 1; }
            case "$out" in
            *"config:"*) ;;
            *) echo "::error::expected output to mention 'config:'"; exit 1 ;;
            esac
            ;;
          esac

          echo "OK: $bin runs correctly under linux/${{ matrix.goarch }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}-linux-${{ matrix.goarch }}
          path: dist/${{ matrix.binary }}-linux-${{ matrix.goarch }}
          if-no-files-found: error

  router-bundles:
    needs: lint-and-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [arm64, mipsle]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Build FULL and MINIMAL bundles (linux/${{ matrix.goarch }})
        env:
          ARCHES: ${{ matrix.goarch }}
          VERSION: ci-${{ github.sha }}
          CHANNEL: dev
          COMMIT: ${{ github.sha }}
          OUT_DIR: dist/router-bundles
          WORK_DIR: dist/router-bundle-work
        run: sh scripts/build-router-bundles.sh

      - name: Install QEMU user-mode emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static

      - name: Verify bundles under linux/${{ matrix.goarch }}
        run: |
          case "${{ matrix.goarch }}" in
          arm64) runner="qemu-aarch64-static" ;;
          mipsle) runner="qemu-mipsel-static" ;;
          esac
          for edition in full minimal; do
            bundle="dist/router-bundles/keenetic-vpn-$edition-linux-${{ matrix.goarch }}.run"
            "$runner" "$bundle" verify
            "$runner" "$bundle" info
          done

      - name: Upload router bundles
        uses: actions/upload-artifact@v4
        with:
          name: router-bundles-linux-${{ matrix.goarch }}
          path: dist/router-bundles/*
          if-no-files-found: error
