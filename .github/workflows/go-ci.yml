name: Go CI

on:
  pull_request:
    paths:
      - 'cmd/**'
      - 'go.mod'
      - 'scripts/build-go-installers.sh'
      - '.goreleaser.yaml'
      - '.github/workflows/go-ci.yml'
  push:
    branches:
      - main
      - feature-router-groups
    paths:
      - 'cmd/**'
      - 'go.mod'
      - 'scripts/build-go-installers.sh'
      - '.goreleaser.yaml'
      - '.github/workflows/go-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Check formatting
        run: |
          # mux_config.go and control-server/main.go are deliberately written
          # in a compact single-line style and are excluded here rather than
          # reformatted.
          files="$(gofmt -l . | grep -vE '^(cmd/xray-go-agent/mux_config\.go|cmd/xray-go-control-server/main\.go)$' || true)"
          if [ -n "$files" ]; then
            echo "Files need gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      # .goreleaser.yaml is the single source of truth for what gets built
      # for which router architectures; a snapshot build here exercises the
      # exact same build matrix a real release would produce, without
      # requiring a tag or publishing anything.
      - name: Build all targets (GoReleaser snapshot)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> 2'
          args: release --snapshot --clean --skip=publish

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: go-ci-build-snapshot
          path: |
            dist/*/xray-failover-go
            dist/*/xray-go-agent
            dist/*/xray-go-control-server
          if-no-files-found: error
